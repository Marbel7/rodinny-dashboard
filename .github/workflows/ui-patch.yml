# Workflow ui-patch byl odstraněn.
# index.html je správný přímo ve zdrojovém kódu — žádné runtime patchování není potřeba.
# Tento soubor je prázdný záměrně.
name: Lint check (placeholder)
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ověř že index.html existuje
        run: test -f index.html && echo "index.html OK"
