name: Apply UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair auth syntax, mobile Google login and task filters
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          # Critical auth repair: the task helper accidentally lost the
          # window.setTodoDate=function(...) declaration. Because this lives
          # inside the module script, one syntax error prevents the whole
          # module from parsing, including the Google login handler.
          broken = "document.addEventListener('click',function(){tuCloseVice();});window._todoDate=val;document.querySelectorAll('.todo-qd').forEach(function(b){b.classList.toggle('active',b.dataset.val===val)});var dc=document.getElementById('todo-date-custom');if(dc)dc.style.display=val==='other'?'inline-block':'none';};"
          fixed = "document.addEventListener('click',function(){tuCloseVice();});window.setTodoDate=function(el,val){window._todoDate=val;document.querySelectorAll('.todo-qd').forEach(function(b){b.classList.toggle('active',b.dataset.val===val)});var dc=document.getElementById('todo-date-custom');if(dc)dc.style.display=val==='other'?'inline-block':'none';};"
          if broken in s:
              s = s.replace(broken, fixed, 1)
              changed = True
              print('Repaired broken setTodoDate declaration')

          # iOS Safari/private browsing: never fall back to Firebase's
          # firebaseapp.com redirect handler. That handler is the source of
          # the blank white page seen after Google authentication. Keep the
          # login inside the original page using the user-gesture popup.
          login_with_fallback = """const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          setLoginStatus('Připojuji k Google…');
          try{
            // Popup is intentionally preferred on mobile/iOS. It avoids the
            // firebaseapp.com redirect handler that can remain blank in
            // Safari private browsing. The call is made directly from the
            // button click so Safari can treat it as a user-initiated popup.
            await signInWithPopup(auth,prov);
            setLoginStatus('✓ Přihlášeno','#10B981');
          }catch(e){
            console.error('Auth error:',e.code,e.message);
            if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'||e.code==='auth/popup-closed-by-user'){
              setLoginStatus('Popup blokován, přesměrovávám…');
              try{await signInWithRedirect(auth,prov);}
              catch(e2){setLoginStatus('Chyba: '+e2.message,'#EF4444');}
            }else{
              setLoginStatus('Chyba: '+e.code+' — '+e.message,'#EF4444');
            }
          }"""
          login_popup_only = """const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          setLoginStatus('Připojuji k Google…');
          try{
            // Always use popup. Do NOT redirect to firebaseapp.com: on iOS
            // Safari/private browsing that handler can return a blank page.
            // This call stays attached to the user's button gesture.
            await signInWithPopup(auth,prov);
            setLoginStatus('✓ Přihlášeno','#10B981');
          }catch(e){
            console.error('Auth error:',e.code,e.message);
            if(e.code==='auth/popup-blocked'){
              setLoginStatus('Safari zablokoval přihlášení. Povolte vyskakovací okno a zkuste to znovu.','#EF4444');
            }else if(e.code==='auth/cancelled-popup-request'||e.code==='auth/popup-closed-by-user'){
              setLoginStatus('Přihlášení bylo zrušeno. Zkuste to znovu.','#EF4444');
            }else{
              setLoginStatus('Chyba: '+e.code+' — '+e.message,'#EF4444');
            }
          }"""
          if login_with_fallback in s:
              s = s.replace(login_with_fallback, login_popup_only, 1)
              changed = True
              print('Removed Firebase redirect fallback from Google login')

          # Also repair the older redirect-first version if it ever reappears.
          old_login = """const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          setLoginStatus('Připojuji k Google…');
          try{
            if(isMobile){
              setLoginStatus('Přesměrovávám na Google…');
              await signInWithRedirect(auth,prov);
            }else{
              await signInWithPopup(auth,prov);
              setLoginStatus('✓ Přihlášeno','#10B981');
            }
          }catch(e){
            console.error('Auth error:',e.code,e.message);
            if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'||e.code==='auth/popup-closed-by-user'){
              setLoginStatus('Popup blokován, přesměrovávám…');
              try{await signInWithRedirect(auth,prov);}
              catch(e2){setLoginStatus('Chyba: '+e2.message,'#EF4444');}
            }else{
              setLoginStatus('Chyba: '+e.code+' — '+e.message,'#EF4444');
            }
          }"""
          if old_login in s:
              s = s.replace(old_login, login_popup_only, 1)
              changed = True
              print('Repaired redirect-first Google login')

          # Keep the existing mobile task-filter styling patch.
          marker = 'id="tasks-direct-ui-v1"'
          if marker not in s:
              css = r'''<style id="tasks-direct-ui-v1">
          @media(max-width:768px){
            #panel-ukoly .todo-qd{
              display:inline-flex!important;align-items:center!important;justify-content:center!important;
              min-height:38px!important;height:38px!important;padding:0 14px!important;
              border-radius:999px!important;border:1px solid #E2E6EF!important;
              background:#F8FAFC!important;color:#64748B!important;
              font-size:12px!important;font-weight:700!important;white-space:nowrap!important;
              flex:0 0 auto!important;box-shadow:none!important;
            }
            #panel-ukoly .todo-qd.active{
              background:#6366F1!important;border-color:#6366F1!important;color:#fff!important;
              box-shadow:0 4px 12px rgba(99,102,241,.18)!important;
            }
            #panel-ukoly .todo-qd[data-val="other"]{font-size:0!important;}
            #panel-ukoly .todo-qd[data-val="other"]:after{content:'Více';font-size:12px!important;}
            #panel-ukoly .todo-qw{
              display:inline-flex!important;align-items:center!important;justify-content:center!important;
              min-height:36px!important;height:36px!important;padding:0 14px!important;
              border-radius:999px!important;border:1px solid #E2E6EF!important;
              background:#fff!important;color:#64748B!important;
              font-size:12px!important;font-weight:700!important;white-space:nowrap!important;
              flex:0 0 auto!important;
            }
            #panel-ukoly .todo-qw.active{
              background:#EEF2FF!important;border-color:#C7D2FE!important;color:#4F46E5!important;
            }
            #panel-ukoly .card{border-radius:18px!important;padding:16px!important;}
            #panel-ukoly .todo-add .fi{height:48px!important;border-radius:14px!important;font-size:16px!important;}
            #panel-ukoly .todo-add .btn-p{height:48px!important;width:48px!important;min-width:48px!important;border-radius:14px!important;padding:0!important;}
          }
          </style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
              changed = True
              print('Added task filter styling')

          p.write_text(s, encoding='utf-8')
          print('Changed:', changed)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: prevent Firebase redirect blank page"
          git push
